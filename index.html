<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003359" />
    <title>Preshift Rota</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load alongside the app rather than ahead of it: until they land the system face stands in. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23003359%22/%3E%3Cpath d=%22M11 23V9h6.2a4.6 4.6 0 0 1 0 9.2H11%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
    <style>
      /* The opening screen, inline so it paints with the first bytes of the page. The app draws the
         same markup (Splash in src/ui/App.tsx) until the organisation has loaded. */
      .splash {
        --s-bg: #ffffff; --s-wash: #d9e7f2; --s-ink: #003359; --s-muted: #667a8c; --s-track: #e2e6ea; --s-mark: #003359; --s-mark-ink: #ffffff;
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 24px 16px; text-align: center;
        background: radial-gradient(900px 420px at 50% -120px, var(--s-wash), transparent 70%), var(--s-bg);
        color: var(--s-ink);
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      /* A quick load never shows the screen at all: the page's own copy fades in only after a short pause.
         The app's copy that takes over from it is drawn at once, so the hand-over does not blink. */
      .splash-enter { animation: splash-in 400ms ease-out both; }
      @media (prefers-color-scheme: dark) {
        .splash { --s-bg: #021a2d; --s-wash: #003359; --s-ink: #e3eef6; --s-muted: #8aa3b7; --s-track: #143550; --s-mark: #e3eef6; --s-mark-ink: #021a2d; }
      }
      .splash-mark { width: 56px; height: 56px; }
      .splash-mark svg { display: block; width: 100%; height: 100%; }
      .splash-mark rect { fill: var(--s-mark); }
      .splash-mark path { fill: none; stroke: var(--s-mark-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .splash-word { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: -0.03em; }
      .splash-word span { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--s-muted); }
      .splash-bar { position: relative; width: 160px; height: 3px; border-radius: 3px; overflow: hidden; background: var(--s-track); margin-top: 6px; }
      .splash-bar span { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--s-ink); animation: splash-slide 1.1s ease-in-out infinite; }
      .splash-error { margin: 4px 0 0; max-width: 420px; font-size: 14px; color: var(--s-muted); }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-in { 0%, 50% { opacity: 0; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-enter { animation: none; }
        .splash-bar span { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash splash-enter" aria-busy="true">
        <div class="splash-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" /><path d="M11 23V9h6.2a4.6 4.6 0 0 1 0 9.2H11" /></svg>
        </div>
        <div class="splash-word">Preshift<span>with Williams, Stanley &amp; Co.</span></div>
        <div class="splash-bar" role="progressbar" aria-label="Loading Preshift"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
