name: Live checks

# The browser checks against the live site, after every production deployment, once a night as a
# backstop, and on demand. They go in through the public demo, so each run works in fresh sandboxes:
# no account, no real data, nothing saved. A failure opens an issue (or adds to the open one) so it is
# seen without anyone watching Actions, and the issue closes itself when the checks pass again.
on:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# A newer deployment makes a run on the one before it moot.
concurrency:
  group: live-checks
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live checks
    # Vercel reports every deployment; only a production one that succeeded is the live site.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The customers' address, not the deployment's own URL, which sits behind Vercel's sign-in.
      PRESHIFT_E2E_URL: ${{ vars.PRESHIFT_LIVE_URL || 'https://preshift.williamsstanley.co' }}
      PRESHIFT_E2E_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-check-traces
          path: test-results/
          retention-days: 14
      - name: Report the result on the live checks issue
        if: always() && (success() || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Live checks failing';
            const passed = '${{ job.status }}' === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const what = context.eventName === 'deployment_status'
              ? `after deploying ${context.payload.deployment.sha.slice(0, 7)}`
              : context.eventName === 'schedule' ? 'on the nightly run' : 'on a manual run';
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 }))
              .data.find((i) => i.title === title && !i.pull_request);
            if (passed) {
              if (open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Passing again ${what}: ${run}` });
                await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            const body = `The browser checks failed against ${process.env.PRESHIFT_E2E_URL} ${what}.\n\nRun and traces: ${run}`;
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
